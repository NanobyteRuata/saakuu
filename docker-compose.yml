name: saakuu

# Host ports are overridable and default away from the usual ones so this stack can
# run next to other local Postgres/Redis/MinIO instances.

x-app-env: &app-env
  DATABASE_URL: postgresql://saakuu:saakuu@postgres:5432/saakuu
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: saakuu
  S3_SECRET_ACCESS_KEY: saakuu-secret
  S3_BUCKET: saakuu
  S3_FORCE_PATH_STYLE: "true"
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9002}
  WORKER_CONCURRENCY: "3"
  MEDIA_CONCURRENCY: "2"
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
  # Auth and email come from the host shell or a root .env; the dev secret is a fallback only.
  AUTH_SECRET: ${AUTH_SECRET:-dev-only-insecure-secret-change-me-0123456789}
  AUTH_URL: ${AUTH_URL:-http://localhost:3000}
  AUTH_TRUST_HOST: "true"
  AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
  AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
  EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-log}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-SaaKuu <onboarding@resend.dev>}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saakuu
      POSTGRES_PASSWORD: saakuu
      POSTGRES_DB: saakuu
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saakuu -d saakuu"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # Docker Hub `minio/minio` is no longer published; quay.io is the official registry.
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: saakuu
      MINIO_ROOT_PASSWORD: saakuu-secret
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 saakuu saakuu-secret && mc mb --ignore-existing local/saakuu
    restart: "no"

  migrate:
    build: .
    command: ["pnpm", "db:deploy"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    command: ["pnpm", "start"]
    environment: *app-env
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build: .
    command: ["pnpm", "worker"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
