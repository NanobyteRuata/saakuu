name: CI

# A commit that touches only documentation runs nothing, and so deploys nothing.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

# Everything runs against the docker compose Postgres, Redis and MinIO on their default host ports.
# AI_PROVIDER=fake: nothing here touches Gemini, and no API key is configured.
env:
  CI: "true"
  DATABASE_URL: postgresql://saakuu:saakuu@localhost:5433/saakuu
  REDIS_URL: redis://localhost:6380
  S3_ENDPOINT: http://localhost:9002
  S3_PUBLIC_ENDPOINT: http://localhost:9002
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: saakuu
  S3_SECRET_ACCESS_KEY: saakuu-secret
  S3_BUCKET: saakuu
  S3_FORCE_PATH_STYLE: "true"
  AI_PROVIDER: fake
  AI_FAKE_BEHAVIOUR: ok
  EXTRACTION_RPM: "600"
  # 32 bytes of base64, so the crypto round-trip runs on CI too.
  ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0wMTIzNDU2Nzg=
  AUTH_SECRET: ci-only-secret-not-for-production-0123456789
  AUTH_URL: http://localhost:3000
  EMAIL_TRANSPORT: test
  NEXT_TELEMETRY_DISABLED: "1"
  PRISMA_HIDE_UPDATE_MESSAGE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # On the job, not the workflow: a newer push cancels these tests, never a deploy that is under way.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Start Postgres, Redis and MinIO
        run: docker compose up -d --wait postgres redis minio && docker compose run --rm minio-init

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and migrate
        run: pnpm db:generate && pnpm db:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start worker
        run: nohup pnpm worker > worker.log 2>&1 &

      # Playwright starts `pnpm dev` itself (playwright.config.ts). `next start` would run in production mode,
      # where the in-memory test email transport the specs read is refused.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            worker.log
          retention-days: 7

  # One image, three roles (Dockerfile). Built here so the server never builds: it only pulls (docs/09 §9).
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nanobyteruata/saakuu:${{ github.sha }}
            ghcr.io/nanobyteruata/saakuu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.sha }}
    secrets: inherit
